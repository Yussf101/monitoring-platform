[defaults]
# Dynamic inventory reads targets from the FastAPI API at runtime.
# This eliminates the manual vm_list.txt editing from the v1 project.
inventory = inventory/dynamic_inventory.py

# Default SSH user — can be overridden per-host via the API's ssh_user field.
remote_user = youssef

# Disable host key checking for dev/demo environment.
# Avoids SSH fingerprint prompts when connecting to new VMs.
host_key_checking = False

# Keep the project directory clean — no .retry files on failed runs.
retry_files_enabled = False

# Increase SSH timeout for slower VM environments.
timeout = 30

[privilege_escalation]
# Most tasks require root (systemd, user creation, firewall).
become = True
become_method = sudo
