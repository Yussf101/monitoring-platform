# Node Exporter installation tasks.
#
# Downloads the Node Exporter binary from GitHub releases, creates a
# dedicated system user, deploys a systemd unit file, opens the firewall
# port, and verifies the service is responding.
#
# All tasks are idempotent — running the playbook twice produces no
# changes on the second run.

---
# --- System user and group ---

- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    comment: "Prometheus Node Exporter service account"

# --- Binary download and installation ---

- name: Download Node Exporter tarball
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    mode: "0644"
  register: download_result

- name: Extract Node Exporter binary
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: /tmp/
    remote_src: true
  when: download_result.changed

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: restart node_exporter

# --- Systemd service ---

- name: Deploy Node Exporter systemd unit file
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

# --- Firewall rules (distro-specific) ---

- name: Open Node Exporter port in UFW (Debian/Ubuntu)
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
    comment: "Prometheus Node Exporter"
  when: ansible_os_family == "Debian"
  ignore_errors: true

- name: Open Node Exporter port in firewalld (RedHat/Fedora)
  ansible.posix.firewalld:
    port: "{{ node_exporter_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: ansible_os_family == "RedHat"
  ignore_errors: true

# --- Service enablement ---

- name: Enable and start Node Exporter service
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

# --- Health check ---

- name: Verify Node Exporter is responding
  ansible.builtin.uri:
    url: "http://localhost:{{ node_exporter_port }}/metrics"
    return_content: false
    status_code: 200
  register: health_check
  retries: 3
  delay: 5
  until: health_check.status == 200
