services:
  db:
    image: postgres:15-alpine
    container_name: monitoring-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Mount source code and migrations for hot-reload and alembic
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ansible:
    build:
      context: ./ansible
      dockerfile: Dockerfile
    container_name: monitoring-ansible
    environment:
      - MONITORING_API_URL=http://backend:8000
    volumes:
      - ~/.ssh:/mnt/ssh:ro
    depends_on:
      backend:
        condition: service_started
    profiles:
      - provision

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: monitoring-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
